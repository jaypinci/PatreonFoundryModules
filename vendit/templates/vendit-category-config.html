<div class="vendit-root vendit-catconfig-root">
  <div class="vendit-catconfig-body">
    <p class="vendit-catconfig-hint">
      One category per line. These populate the shop's category filter and the item-tagging menu.
      Add, remove, or rename freely — changes apply to every VENDIT terminal in this world.
    </p>
    <textarea name="categories" rows="12" class="vendit-desc-textarea vendit-catconfig-textarea"
              placeholder="Weapons&#10;Armor&#10;Cyberware&#10;...">{{categories}}</textarea>
  </div>
  <footer class="vendit-catconfig-footer">
    <button type="submit" class="vendit-dispense">
      <i class="fas fa-save"></i> SAVE CATEGORIES
    </button>
  </footer>
</div>
